name: Build Celeste for Apple platforms

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Devices to build for (iOS includes iPhone and iPad)
        required: true
        default: tvos
        type: choice
        options:
          - tvos
          - ios
          - both
      ios_bundle_id:
        description: Optional iPhone/iPad app identity inside the unsigned IPA
        required: false
        default: io.github.celeste-ios.cloud
        type: string
      bundle_id:
        description: Optional Apple TV app identity inside the unsigned IPA
        required: false
        default: io.github.celeste-tvos.cloud
        type: string

permissions:
  contents: write

concurrency:
  group: celeste-tvos-cloud-operations-${{ github.repository_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUD_PUBLIC_REPOSITORY: hmcneill46/morro-celeste
      CLOUD_PUBLIC_SOURCE_SHA: cc02b0cc697bd620c0dc864d4af3c60d79a95e85
      CLOUD_NATIVE_LOGICAL_SHA256: 6286e0545b32e9c56732955d4cf816ed8f5dc0d816ab610dd9fe1752090a01fc
      CLOUD_INPUT_TAG: celeste-tvos-inputs
      CLOUD_OUTPUT_TAG: celeste-tvos-output
      CLOUD_BUNDLE_ID: ${{ inputs.bundle_id }}
      CLOUD_IOS_BUNDLE_ID: ${{ inputs.ios_bundle_id }}
      CLOUD_PLATFORM: ${{ inputs.platform }}
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      MSBUILDDISABLENODEREUSE: "1"
      DOTNET_CLI_USE_MSBUILD_SERVER: "0"
      UseSharedCompilation: "false"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      GIT_TERMINAL_PROMPT: "0"
      NO_COLOR: "1"

    steps:
      - name: Checking private repository
        shell: bash
        run: |
          set -euo pipefail
          metadata="$(gh api "repos/$GITHUB_REPOSITORY")"
          if ! REPOSITORY_METADATA="$metadata" python3 - <<'PY'
          import json, os
          value = json.loads(os.environ["REPOSITORY_METADATA"])
          raise SystemExit(0 if value.get("private") is True and value.get("visibility") == "private" else 1)
          PY
          then
            {
              echo '# Celeste — Build refused'
              echo
              echo '**This workflow only runs in a private repository.**'
              echo
              echo 'Create a private repository from the template before uploading Celeste or FMOD.'
              echo 'No private input was downloaded.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo 'error: This workflow only runs in a private repository.' >&2
            echo 'Create a private repository from the template before uploading Celeste or FMOD.' >&2
            exit 1
          fi
          echo 'Repository privacy: PASS (private)'

      # actions/checkout v7.0.1
      - name: Check out cloud-builder instructions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Preparing runner
        shell: bash
        run: |
          set -euo pipefail
          source scripts/cloud-common.sh
          cloud_set_stage \
            'The exact GitHub macOS build environment is unavailable.' \
            'Retry later or use the local Mac builder; do not bypass the pinned toolchain checks.'

          case "$CLOUD_PLATFORM" in
            ios|tvos|both) ;;
            *) echo 'error: choose tvos, ios, or both' >&2; exit 1 ;;
          esac
          test "$(uname -m)" = arm64
          xcodebuild -checkFirstLaunchStatus
          xcode_version_output="$(xcodebuild -version)"
          test "${xcode_version_output%%$'\n'*}" = 'Xcode 26.6'
          test "$(xcrun --sdk appletvos --show-sdk-version)" = '26.5'
          if [[ "$CLOUD_PLATFORM" != tvos ]]; then
            test "$(xcrun --sdk iphoneos --show-sdk-version)" = '26.5'
          fi
          # The template has no global.json; newer installed SDKs must not win.
          printf '%s\n' '{"sdk":{"version":"10.0.302","rollForward":"disable","allowPrerelease":false}}' > global.json
          test "$(dotnet --version)" = '10.0.302'

          command -v gmake >/dev/null 2>&1 || brew install make
          command -v monodis >/dev/null 2>&1 || brew install mono

          if ! dotnet --list-runtimes | grep -Eq '^Microsoft\.NETCore\.App 6\.0\.36 '; then
            installer="$RUNNER_TEMP/celeste-tvos-dotnet-install.sh"
            curl -fsSL \
              'https://raw.githubusercontent.com/dotnet/install-scripts/03c981b3ae8261cb0a48b07ac884ce0031af384c/src/dotnet-install.sh' \
              -o "$installer"
            printf '%s  %s\n' \
              '082f7685e156738a1b2e2ed8381a621870d4ce8e8c59278034556f05c186eb2e' \
              "$installer" | shasum -a 256 -c -
            install_root="$(python3 -c 'import os, shutil; print(os.path.dirname(os.path.realpath(shutil.which("dotnet"))))')"
            bash "$installer" --runtime dotnet --version 6.0.36 \
              --install-dir "$install_root" --skip-non-versioned-files
          fi

          workloads=(tvos)
          if [[ "$CLOUD_PLATFORM" != tvos ]]; then workloads+=(ios); fi
          # Explicitly select the workload set even if the image has newer workloads.
          dotnet workload install "${workloads[@]}" --version 10.0.302.0
          test "$(dotnet workload --version)" = '10.0.302.0'
          dotnet --list-runtimes | grep -Eq '^Microsoft\.NETCore\.App 6\.0\.36 '
          python3 scripts/prepare-inputs.py check-disk --path "$RUNNER_TEMP" --minimum-gib 25

          printf 'Runner: %s / %s / image %s\n' "$RUNNER_OS" "$RUNNER_ARCH" "${ImageVersion:-unknown}"
          printf 'Toolchain: Xcode 26.6 / tvOS 26.5 / .NET 10.0.302 / workload 10.0.302.0\n'

      - name: Check out exact public Celeste source
        shell: bash
        run: |
          set -euo pipefail
          source scripts/cloud-common.sh
          cloud_set_stage \
            'The pinned public Celeste source could not be checked out exactly.' \
            'Retry after GitHub is reachable. The workflow never substitutes another branch or commit.'
          source_root="$RUNNER_TEMP/celeste-tvos-cloud-source"
          mkdir -p "$source_root"
          git -C "$source_root" init
          git -C "$source_root" remote add origin "https://github.com/$CLOUD_PUBLIC_REPOSITORY.git"
          git -C "$source_root" fetch --no-tags origin "$CLOUD_PUBLIC_SOURCE_SHA"
          git -C "$source_root" checkout --detach "$CLOUD_PUBLIC_SOURCE_SHA"
          git -C "$source_root" -c url.https://github.com/.insteadOf=git://github.com/ \
            submodule update --init --recursive
          python3 scripts/prepare-inputs.py verify-source \
            --root "$source_root" --sha "$CLOUD_PUBLIC_SOURCE_SHA"
          test -z "$(git -C "$source_root" submodule status --recursive | awk '/^[+U]/')"
          echo "CELESTE_SOURCE_ROOT=$source_root" >> "$GITHUB_ENV"
          echo "Pinned public source: ${CLOUD_PUBLIC_SOURCE_SHA:0:12}"
          if [[ "$CLOUD_PLATFORM" != ios ]]; then
            (cd "$source_root" && ./build-tvos.sh --check-host)
          fi
          if [[ "$CLOUD_PLATFORM" != tvos ]]; then
            (cd "$source_root" && ./build-ios.sh --doctor --non-interactive)
          fi

      - name: Inspect private input Release
        shell: bash
        run: |
          set -euo pipefail
          source scripts/cloud-common.sh
          cloud_set_stage \
            'The private input Release is missing or has the wrong assets.' \
            'Publish celeste-tvos-inputs with exactly one supported Celeste ZIP and one official FMOD DMG.'
          cloud_ensure_output_absent
          input_root="$RUNNER_TEMP/celeste-tvos-cloud-inputs"
          mkdir -p "$input_root"
          gh release view "$CLOUD_INPUT_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,assets > "$input_root/release.json"
          python3 scripts/prepare-inputs.py classify-assets \
            --release-json "$input_root/release.json" \
            --output "$input_root/asset-manifest.json"
          echo "CLOUD_INPUT_ROOT=$input_root" >> "$GITHUB_ENV"
          echo 'Private input Release: exactly one ZIP and one DMG'

      - name: Downloading private inputs
        shell: bash
        run: |
          set -euo pipefail
          source scripts/cloud-common.sh
          cloud_set_stage \
            'The private input assets could not be downloaded or verified.' \
            'Check the celeste-tvos-inputs Release, then retry. GitHub credentials are not required.'
          download_root="$CLOUD_INPUT_ROOT/downloads"
          mkdir -p "$download_root"
          gh release download "$CLOUD_INPUT_TAG" --repo "$GITHUB_REPOSITORY" --dir "$download_root"
          python3 scripts/prepare-inputs.py verify-downloads \
            --manifest "$CLOUD_INPUT_ROOT/asset-manifest.json" \
            --directory "$download_root" \
            --output "$CLOUD_INPUT_ROOT/verified-assets.json"
          echo 'Private input download and GitHub digest check: PASS'

      - name: Safely extract and mount inputs
        shell: bash
        run: |
          set -euo pipefail
          source scripts/cloud-common.sh
          cloud_set_stage \
            'The Celeste ZIP or FMOD DMG could not be prepared safely.' \
            'Upload an unmodified supported ZIP and the original FMOD iOS/tvOS 1.10.09 build 97915 DMG.'
          game_asset="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["game"]["path"])' "$CLOUD_INPUT_ROOT/verified-assets.json")"
          fmod_asset="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["fmod"]["path"])' "$CLOUD_INPUT_ROOT/verified-assets.json")"
          game_root="$RUNNER_TEMP/celeste-tvos-cloud-game"
          fmod_mount="$RUNNER_TEMP/celeste-tvos-cloud-fmod"
          python3 scripts/prepare-inputs.py extract-zip \
            --archive "$game_asset" --destination "$game_root" \
            --output "$CLOUD_INPUT_ROOT/extraction.json"
          mkdir -p "$fmod_mount"
          hdiutil attach "$fmod_asset" -readonly -nobrowse -mountpoint "$fmod_mount" >/dev/null
          fmod_root="$(python3 scripts/prepare-inputs.py find-fmod-root --mount "$fmod_mount")"
          {
            echo "CELESTE_GAME_ROOT=$game_root"
            echo "FMOD_SDK_ROOT=$fmod_root"
            echo "CLOUD_FMOD_MOUNT=$fmod_mount"
          } >> "$GITHUB_ENV"
          echo 'Archive traversal/link checks and read-only FMOD mount: PASS'

      - name: Validating inputs
        shell: bash
        run: |
          set -euo pipefail
          source scripts/cloud-common.sh
          cloud_set_stage \
            'Celeste or FMOD did not match an exact supported input.' \
            'Use a clean listed Celeste 1.4.0.0 FNA profile and FMOD iOS/tvOS 1.10.09 build 97915.'
          celeste_manifest="$CELESTE_SOURCE_ROOT/.build/celeste-runtime/stage18c-cloud/celeste-input.json"
          fmod_manifest="$CELESTE_SOURCE_ROOT/.build/fmod-tvos/stage18c-cloud/sdk-manifest.json"
          mkdir -p "$(dirname "$celeste_manifest")" "$(dirname "$fmod_manifest")"
          "$CELESTE_SOURCE_ROOT/scripts/validate-celeste-input.sh" \
            --game-root "$CELESTE_GAME_ROOT" --output "$celeste_manifest"
          if [[ "$CLOUD_PLATFORM" != ios ]]; then
            "$CELESTE_SOURCE_ROOT/scripts/validate-fmod-tvos-sdk.sh" \
              --sdk-root "$FMOD_SDK_ROOT" --output "$fmod_manifest"
          fi
          if [[ "$CLOUD_PLATFORM" != tvos ]]; then
            python3 "$CELESTE_SOURCE_ROOT/scripts/validate-fmod-ios-sdk.py" \
              --sdk-root "$FMOD_SDK_ROOT" \
              --lock "$CELESTE_SOURCE_ROOT/native/fmod-ios-dependencies.lock.json" \
              --output "$CELESTE_SOURCE_ROOT/.build/ios-self-build/cloud-fmod.json"
          fi
          python3 - "$celeste_manifest" <<'PY'
          import json, pathlib, sys
          value = json.loads(pathlib.Path(sys.argv[1]).read_text())
          print(f"Celeste {value['gameVersion']}: {value['store']} / {value['sourcePlatform']} / {value['runtimeFamily']}")
          print(f"Profile: {value['profileId']}")
          print(f"Canonical game: {value['canonicalClass']}")
          PY
          game_asset="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["game"]["path"])' "$CLOUD_INPUT_ROOT/verified-assets.json")"
          rm -f -- "$game_asset"
          python3 scripts/prepare-inputs.py check-disk --path "$RUNNER_TEMP" --minimum-gib 25
          echo 'Exact Celeste and FMOD validation: PASS; transferred ZIP removed from runner'

      - name: Compute safe cache identity
        if: inputs.platform != 'ios'
        shell: bash
        run: |
          set -euo pipefail
          source scripts/cloud-common.sh
          cloud_set_stage \
            'The safe native cache identity could not be computed.' \
            'Retry the workflow; proprietary files are never included in this cache.'
          cache_key="$(cloud_compute_cache_key "$CELESTE_SOURCE_ROOT")"
          echo "CLOUD_CACHE_KEY=$cache_key" >> "$GITHUB_ENV"
          echo "Safe cache key: ${cache_key:0:96}…"

      # actions/cache v6.1.0. Only redistributable/open-source native outputs.
      - name: Restoring safe cache
        if: inputs.platform != 'ios'
        id: native-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ runner.temp }}/celeste-tvos-cloud-source/artifacts/tvos-native/self-build
            ${{ runner.temp }}/celeste-tvos-cloud-source/.build/tvos-host
          key: ${{ env.CLOUD_CACHE_KEY }}

      - name: Verify restored safe cache
        if: steps.native-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source scripts/cloud-common.sh
          cloud_set_stage \
            'The restored open-source native cache failed exact verification.' \
            'Run Clean private build files with cache deletion, then build again.'
          cloud_verify_safe_cache_paths "$CELESTE_SOURCE_ROOT"
          echo 'Safe native cache hit and independent verification: PASS'

      - name: Build and verify selected vanilla products
        shell: bash
        run: |
          set -euo pipefail
          source scripts/cloud-common.sh
          cloud_set_stage \
            'A selected builder or product verifier failed.' \
            'Open the failed phase and correct its first reported problem. No partial build is published.'
          output_root="$RUNNER_TEMP/celeste-tvos-cloud-output"
          echo "CLOUD_OUTPUT_ROOT=$output_root" >> "$GITHUB_ENV"
          python3 scripts/build-products.py build \
            --platform "$CLOUD_PLATFORM" \
            --source-root "$CELESTE_SOURCE_ROOT" \
            --source-sha "$CLOUD_PUBLIC_SOURCE_SHA" \
            --output-root "$output_root" \
            --game-root "$CELESTE_GAME_ROOT" \
            --fmod-root "$FMOD_SDK_ROOT" \
            --bundle-id "$CLOUD_BUNDLE_ID" \
            --ios-bundle-id "$CLOUD_IOS_BUNDLE_ID"

      # actions/cache v6.1.0. No proprietary/generated game path is listed.
      - name: Save safe cache after a cache miss
        if: success() && inputs.platform != 'ios' && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ runner.temp }}/celeste-tvos-cloud-source/artifacts/tvos-native/self-build
            ${{ runner.temp }}/celeste-tvos-cloud-source/.build/tvos-host
          key: ${{ env.CLOUD_CACHE_KEY }}

      - name: Publishing private IPAs
        shell: bash
        run: |
          set -euo pipefail
          source scripts/cloud-common.sh
          cloud_set_stage \
            'The verified IPAs could not be published to the private output Release.' \
            'Check Release permissions and any incomplete output draft before retrying; existing outputs are preserved.'
          python3 scripts/build-products.py publish \
            --platform "$CLOUD_PLATFORM" --output-root "$CLOUD_OUTPUT_ROOT"

      - name: Cleaning runner
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -f scripts/cloud-common.sh ]]; then
            source scripts/cloud-common.sh
            cloud_runner_cleanup
          else
            hdiutil detach "$RUNNER_TEMP/celeste-tvos-cloud-fmod" -force >/dev/null 2>&1 || true
            rm -rf -- "$RUNNER_TEMP/celeste-tvos-cloud-inputs" \
              "$RUNNER_TEMP/celeste-tvos-cloud-game" \
              "$RUNNER_TEMP/celeste-tvos-cloud-fmod" \
              "$RUNNER_TEMP/celeste-tvos-cloud-source" \
              "$RUNNER_TEMP/celeste-tvos-cloud-output"
          fi
          df -h "$RUNNER_TEMP"

      - name: Write failure summary
        if: failure()
        shell: bash
        run: |
          if [[ -f scripts/cloud-common.sh ]]; then
            scripts/cloud-common.sh failure-summary
          fi
